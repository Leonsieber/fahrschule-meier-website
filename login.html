<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Login – Fahrschule Meier</title>
  <link rel="icon" href="img/mark-dark.png">
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main class="auth-wrap">
    <div class="auth-side">
      <h1 data-th="auth.side"></h1>
      <p data-t="auth.side_text"></p>
    </div>
    <div class="auth-form">
      <div class="switch">
        <button type="button" data-mode="login" data-t="auth.login"></button>
        <button type="button" data-mode="register" data-t="auth.register"></button>
      </div>

      <form id="loginForm" novalidate>
        <div class="field"><label for="le" data-t="auth.email"></label><input id="le" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="lp" data-t="auth.password"></label><input id="lp" name="password" type="password" autocomplete="current-password" required></div>
        <div class="form-error" role="alert"></div>
        <button class="btn" type="submit" data-t="auth.login"></button>
      </form>

      <form id="registerForm" class="hidden" novalidate>
        <div class="row">
          <div class="field"><label for="rf" data-t="auth.first"></label><input id="rf" name="first_name" autocomplete="given-name" required></div>
          <div class="field"><label for="rl" data-t="auth.last"></label><input id="rl" name="last_name" autocomplete="family-name" required></div>
        </div>
        <div class="row">
          <div class="field"><label for="re" data-t="auth.email"></label><input id="re" name="email" type="email" autocomplete="email" required></div>
          <div class="field"><label for="rt" data-t="auth.phone"></label><input id="rt" name="phone" type="tel" autocomplete="tel" required placeholder="079 123 45 67"></div>
        </div>
        <div class="row">
          <div class="field"><label for="rs" data-t="auth.street"></label><input id="rs" name="street" autocomplete="street-address"></div>
          <div class="field"><label for="rz" data-t="auth.zip"></label><input id="rz" name="zip_city" placeholder="8580 Amriswil"></div>
        </div>
        <div class="row">
          <div class="field"><label for="rb" data-t="auth.birth"></label><input id="rb" name="birthdate" type="date"></div>
          <div class="field"><label for="rp" data-t="auth.password"></label><input id="rp" name="password" type="password" autocomplete="new-password" minlength="8" required data-tp="auth.pw_hint"></div>
        </div>
        <p class="auth-note" data-th="auth.privacy"></p>
        <div class="form-error" role="alert"></div>
        <button class="btn" type="submit" data-t="btn.register"></button>
      </form>

      <div class="auth-direct" id="authDirect" hidden>
        <h2 data-t="auth.direct"></h2>
        <p data-t="auth.direct_s"></p>
        <ul class="book-ways">
          <li><a id="dWa" target="_blank" rel="noopener"><span class="btn-ico" data-icon="chat"></span><span><b data-t="btn.whatsapp"></b><small data-t="book.wa_short"></small></span></a></li>
          <li><a id="dTel"><span class="btn-ico" data-icon="phone"></span><span><b id="dTelT"></b><small data-t="btn.call"></small></span></a></li>
          <li><a id="dMail"><span class="btn-ico" data-icon="mail"></span><span><b id="dMailT"></b><small data-t="book.mail"></small></span></a></li>
        </ul>
      </div>
    </div>
  </main>
  <script src="js/i18n.js?v=5"></script>
  <script src="js/common.js?v=5"></script>
  <script>
  (async function () {
    const hash = location.hash.slice(1);
    const go = (u) => { location.href = u.role === 'admin' ? 'admin.html' : (hash === 'buchen' ? 'konto.html#buchen' : 'konto.html'); };
    const u = await App.loadUser();
    if (u) return go(u);
    App.renderHeader();
    App.applyStatic();
    // Direkter Kontakt als Alternative zum Konto
    try {
      const c = (await App.api('GET', '/api/public?lang=' + App.lang)).content;
      const phone = (c['contact.phone'] || '').trim(), mail = (c['contact.email'] || '').trim();
      document.getElementById('dWa').href = App.waLink(phone);
      document.getElementById('dTel').href = 'tel:' + phone.replace(/[^\d+]/g, '');
      document.getElementById('dTelT').textContent = phone;
      document.getElementById('dMail').href = 'mailto:' + mail;
      document.getElementById('dMailT').textContent = mail;
      document.querySelectorAll('#authDirect [data-icon]').forEach((s) => { s.innerHTML = App.icon(s.dataset.icon); });
      document.getElementById('authDirect').hidden = false;
    } catch { /* ohne Daten bleibt nur das Formular */ }
    const forms = { login: document.getElementById('loginForm'), register: document.getElementById('registerForm') };
    function mode(m) {
      document.querySelectorAll('[data-mode]').forEach((b) => b.classList.toggle('active', b.dataset.mode === m));
      Object.entries(forms).forEach(([k, f]) => f.classList.toggle('hidden', k !== m));
    }
    document.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => mode(b.dataset.mode)));
    mode(hash === 'register' ? 'register' : 'login');

    for (const [m, f] of Object.entries(forms)) {
      f.addEventListener('submit', async (e) => {
        e.preventDefault();
        const err = f.querySelector('.form-error'); err.textContent = '';
        const body = Object.fromEntries(new FormData(f)); body.lang = App.lang;
        const btn = f.querySelector('[type=submit]'); btn.disabled = true;
        try { const r = await App.api('POST', '/api/' + m, body); go(r.user); }
        catch (ex) { err.textContent = App.errText(ex); btn.disabled = false; }
      });
    }
  })();
  </script>
</body>
</html>
